[project]
name = "irtra-calidad-ia"
version = "0.1.0"
description = "Sistema local para clasificar encuestas escaneadas con OpenAI, dashboard y exportacion a Excel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "jinja2>=3.1.6",
  "openai>=1.108.0",
  "openpyxl>=3.1.5",
  "pillow>=11.3.0",
  "pydantic-settings>=2.11.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2",
]

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "uploads*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
